Section "ServerFlags"
  # 禁用 udev 热插拔，防止设备断开导致 X 退出
  # 允许无输入设备也不退出
  # 禁止 VT 切换
  Option "DontVTSwitch" "True"
EndSection
Section "ServerFlags"
  # 允许 udev 热插拔，这样鼠标键盘才能自动被识别
  Option "AutoAddDevices" "True"
  # 允许无输入设备也不退出（可选）
  Option "AllowEmptyInput" "True"
  # 禁止 VT 切换，保持在 SPI 屏的 VT1
  Option "DontVTSwitch" "True"
EndSection
